name: Build Multi-Platform (Desktop & TV)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            bundles: msi,nsis
            run_tests: true
          - name: win-arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
            bundles: nsis
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup MSVC Developer Environment (${{ matrix.msvc_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Run workspace unit tests (native x64)
        if: matrix.run_tests
        run: cargo test --workspace

      - name: Typecheck & build UI + Tauri (${{ matrix.target }})
        run: npm --prefix ui exec -- tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload installer bundles (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: iptvmine-desktop-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/bundle/

  build-macos:
    name: macOS Universal (Intel + Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust toolchain (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: universal-apple-darwin

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Run workspace unit tests (macOS)
        run: cargo test --workspace

      - name: Build macOS Universal bundle (.dmg & .app)
        run: npm --prefix ui exec -- tauri build --target universal-apple-darwin --bundles dmg,app

      - name: Upload macOS Universal bundle
        uses: actions/upload-artifact@v4
        with:
          name: iptvmine-desktop-macos-universal
          path: target/universal-apple-darwin/release/bundle/

  build-linux:
    name: Linux x64 (.deb, .rpm, .AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfuse2 \
            libxdo-dev \
            patchelf \
            rpm \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Run workspace unit tests (Linux x64)
        run: cargo test --workspace

      - name: Build Linux x64 bundles (.deb, .rpm, .AppImage)
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm --prefix ui exec -- tauri build --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage

      - name: Verify Linux bundle outputs
        run: ls -la target/x86_64-unknown-linux-gnu/release/bundle/deb target/x86_64-unknown-linux-gnu/release/bundle/rpm target/x86_64-unknown-linux-gnu/release/bundle/appimage

      - name: Upload Linux Debian / Ubuntu x64 (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: iptvmine-desktop-linux-deb-x64
          path: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

      - name: Upload Linux RPM x64 (.rpm)
        uses: actions/upload-artifact@v4
        with:
          name: iptvmine-desktop-linux-rpm-x64
          path: target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

      - name: Upload Linux AppImage x64 (.AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: iptvmine-desktop-linux-appimage-x64
          path: target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

  build-tv:
    name: Smart TV Experimental (webOS 23+ & Tizen 8.0+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build Smart TV frontend bundle
        run: npm --prefix ui run build:tv

      - name: Package LG webOS 23+ (.ipk Experimental)
        run: |
          mkdir -p tv-stage/webos tv-dist/webos
          cp -r ui/dist-tv/* tv-stage/webos/
          cp tv/webos/appinfo.json tv/webos/icon.png tv/webos/largeIcon.png tv-stage/webos/
          npm install -g @webos-tools/cli
          ares-package --no-minify tv-stage/webos -o tv-dist/webos
          ls -la tv-dist/webos

      - name: Package Samsung Tizen TV 8.0+ (.wgt Experimental)
        run: |
          mkdir -p tv-stage/tizen tv-dist/tizen
          cp -r ui/dist-tv/* tv-stage/tizen/
          cp tv/tizen/config.xml tv/tizen/icon.png tv-stage/tizen/
          (cd tv-stage/tizen && zip -r ../../tv-dist/tizen/IPTVMine_0.1.0_tizen8.0_experimental.wgt .)
          ls -la tv-dist/tizen

      - name: Upload webOS 23+ package (.ipk)
        uses: actions/upload-artifact@v4
        with:
          name: iptvmine-tv-webos23-experimental
          path: tv-dist/webos/*.ipk

      - name: Upload Samsung Tizen TV 8.0+ package (.wgt)
        uses: actions/upload-artifact@v4
        with:
          name: iptvmine-tv-tizen8-experimental
          path: tv-dist/tizen/*.wgt
