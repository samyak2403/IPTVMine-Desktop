name: Build Windows Desktop (x64 & ARM64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            bundles: msi,nsis
            run_tests: true
          - name: win-arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
            bundles: nsis
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup MSVC Developer Environment (${{ matrix.msvc_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Run workspace unit tests (native x64)
        if: matrix.run_tests
        run: cargo test --workspace

      - name: Typecheck & build UI + Tauri (${{ matrix.target }})
        run: npm --prefix ui exec -- tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload installer bundles (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: iptvmine-desktop-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/bundle/
