[package]
name = "iptvmine-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "iptvmine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
iptvmine-core.workspace = true
iptvmine-storage.workspace = true
iptvmine-net.workspace = true
iptvmine-m3u.workspace = true
iptvmine-vega.workspace = true
iptvmine-fallback.workspace = true
iptvmine-media.workspace = true
iptvmine-downloader.workspace = true
iptvmine-updater.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
